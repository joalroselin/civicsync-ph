<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{width:280px;margin:0;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111827}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#1E3A8A;color:#fff;font-weight:700}
  header img{width:22px;height:22px;border-radius:5px}
  main{padding:12px 14px}
  label{display:flex;justify-content:space-between;align-items:center;font-weight:600}
  p{color:#4B5563;margin:10px 0 0}
  a{color:#991B1B;font-weight:600}
</style>
</head>
<body>
<header><img src="icons/icon-48.png" alt="">CivicSync PH</header>
<main>
  <label>Show bill status on pages <input type="checkbox" id="on"></label>
  <p>Hover a bill number like “SB 1294” on any site to see where it is now. Only bill numbers are sent to CivicSync, never the page you’re on.</p>
  <p><a href="https://civicsync-ph-gamma.vercel.app/?utm_source=extension&utm_medium=popup" target="_blank">Open CivicSync PH</a></p>
</main>
<script src="popup.js"></script>
</body>

# Nightly data (02:30 Manila), ~6 minutes:
# - data/lawmakers.json: every current member's record (/lawmakers, /compare)
# - data/laws.json: Republic Acts, their signed text, IRR agency and deadline
# - data/status/: today's status of every bill and what changed since
#   yesterday (On the move, bill status history, /changes, weekly card)
# Commits only when something changed; the commit redeploys the site.
name: Nightly data

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository == 'joalroselin/civicsync-ph' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-lawmakers.mts
      # Laws: OCR each new Republic Act once to find its IRR deadline (CS-129).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr > /dev/null
      - run: node scripts/build-laws.mts
      - name: Commit if changed
        run: |
          git add data
          # Ignore timestamps: only commit when numbers or statuses changed.
          if git diff --cached --quiet -I '"generatedAt"' -I '"updated"' -I '^\{"date"'; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: nightly lawmakers and bill status ($(date -u +%F))"
          git push
      # Watchlist notifications for today's changes (CS-201). Skips if secrets aren't set.
      - run: npm ci --omit=dev --ignore-scripts
      - name: Send notifications
        env:
          SANITY_API_PROJECT_ID: ${{ secrets.SANITY_API_PROJECT_ID }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mts
